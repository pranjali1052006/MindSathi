services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindsathi
      POSTGRES_USER: mindsathi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mindsathi-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsathi -d mindsathi"]
      interval: 5s
      timeout: 3s
      retries: 15
  risk-service:
    build:
      context: .
      dockerfile: ai/Dockerfile
    expose:
      - "8001"
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mindsathi
      DATABASE_USER: mindsathi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mindsathi-local}
      AI_SERVICE_URL: http://risk-service:8001
      JWT_SECRET: ${JWT_SECRET:-replace-this-demo-secret-before-deployment-mindsathi}
      FRONTEND_ORIGIN: http://localhost:4173
    depends_on:
      db:
        condition: service_healthy
      risk-service:
        condition: service_started
    expose:
      - "8080"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - backend
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
